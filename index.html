<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpongeBob Clicker</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#cdeefa;--bg2:#fff;--tx:#10324a;--mut:#4d7188;--ac:#f4707a;--ac2:#1d9bd1;--ok:#2e9e5b;--ln:#a9d8ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06223a;--bg2:#0c3555;--tx:#e6f6ff;--mut:#8fb7cf;--ln:#17496e;--ac:#ff8d94;--ac2:#4cc3f0}}
:root[data-theme="dark"]{--bg:#06223a;--bg2:#0c3555;--tx:#e6f6ff;--mut:#8fb7cf;--ln:#17496e;--ac:#ff8d94;--ac2:#4cc3f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Baloo 2",system-ui,sans-serif;font-weight:500}
main{max-width:560px;margin:0 auto;padding:12px}
.top{text-align:center}
.bal{font-size:40px;font-weight:800;line-height:1}
.sub{color:var(--mut);font-size:14px}
.lvl{margin:10px 0;background:var(--bg2);border:2px solid var(--ln);border-radius:14px;padding:8px 12px}
.lvl b{font-weight:700}.bar{height:8px;background:var(--ln);border-radius:9px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac2)}
#stage{position:relative;display:grid;place-items:center;padding:6px 0;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#pat{width:min(78vw,340px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:6px solid var(--ac);cursor:pointer;transition:transform .07s;-webkit-user-drag:none;box-shadow:0 8px 0 var(--ln)}
#pat.p{transform:scale(.92) rotate(-2deg)}
.fl{position:fixed;font-weight:800;font-size:24px;color:var(--ac);pointer-events:none;animation:up .8s forwards;text-shadow:0 2px 0 var(--bg2);z-index:9}
.fl.c{color:#e8a200;font-size:32px}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button{flex:1;font:inherit;font-weight:700;padding:9px 4px;border:2px solid var(--ln);background:var(--bg2);color:var(--tx);border-radius:12px;cursor:pointer}
.tabs button.on{background:var(--ac2);border-color:var(--ac2);color:#fff}
.it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--bg2);border:2px solid var(--ln);border-radius:14px;padding:9px 12px;margin-bottom:7px;cursor:pointer}
.it:disabled{opacity:.5;cursor:default}
.it:not(:disabled):active{transform:scale(.98)}
.it .n{font-weight:700}.it .d{font-size:13px;color:var(--mut)}
.it .l{flex:1}.it .c{font-weight:800;color:var(--ok);white-space:nowrap}
.it .q{font-weight:800;font-size:20px;min-width:34px;text-align:center;color:var(--ac2)}
.rb{background:var(--bg2);border:2px dashed var(--ac);border-radius:14px;padding:12px;margin-bottom:10px}
.rb button{font:inherit;font-weight:800;margin-top:8px;width:100%;padding:11px;border:0;border-radius:12px;background:var(--ac);color:#fff;cursor:pointer}
.rb button:disabled{opacity:.45}
.foot{text-align:center;margin-top:14px}.foot button{font:inherit;color:var(--mut);background:none;border:0;text-decoration:underline;cursor:pointer}
.hide{display:none}
:root{--gl:rgba(255,255,255,.72);--s1:#7fd6f3;--s2:#e3f7fd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gl:rgba(10,44,72,.72);--s1:#0b4d7a;--s2:#041a2e}}
:root[data-theme="dark"]{--gl:rgba(10,44,72,.72);--s1:#0b4d7a;--s2:#041a2e}
.hide{display:none!important}
body{background:linear-gradient(180deg,var(--s1),var(--s2)) fixed;min-height:100vh}
main{padding-bottom:96px}
.bb{position:fixed;bottom:-60px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);pointer-events:none;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh)}}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hd img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:3px solid var(--ac);cursor:pointer}
.hd b{font-size:18px}
.it,.lvl,.rb{background:var(--gl);backdrop-filter:blur(10px);border-color:rgba(255,255,255,.4);box-shadow:0 4px 14px rgba(0,40,80,.12)}
.it:not(:disabled){border-color:var(--ok)}
.bal{text-shadow:0 3px 0 rgba(0,40,80,.15)}
#stage::before{content:"";position:absolute;width:min(92vw,400px);aspect-ratio:1;border-radius:50%;background:conic-gradient(#f4707a,#ffd36b,#4cc3f0,#f4707a);filter:blur(22px);opacity:.55;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
#pat{position:relative}
.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--gl);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.4);z-index:5}
.tabs button{font-size:20px;line-height:1.1;padding:6px 2px;position:relative}
.tabs small{display:block;font-size:11px;font-weight:700}
.tabs .dot::after{content:"";position:absolute;top:4px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--ac);border:2px solid var(--bg2)}
.gg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.gt{text-align:center;border:2px solid var(--ln);border-radius:10px;padding:6px 0;font-size:20px;background:var(--bg2)}
.gt small{display:block;font-size:11px;color:var(--mut)}
.gt.now{border-color:var(--ac);background:var(--ac);color:#fff}.gt.now small{color:#fff}
.gt.done{opacity:.55}.gt.done::after{content:"✓";display:block;font-size:12px}
.pf{text-align:center}.av{width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid var(--ac)}
.pf input{display:block;margin:8px auto 0;font:inherit;font-size:20px;font-weight:800;text-align:center;border:2px solid var(--ln);border-radius:10px;padding:4px 8px;background:var(--bg2);color:var(--tx);width:80%}
.row{display:flex;gap:6px;margin-top:8px}.rb .sm{margin:0;padding:8px 2px;font-size:13px;background:var(--ac2)}
.sg,.ag{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.sg div{background:var(--gl);border-radius:12px;padding:8px;text-align:center;font-weight:800;font-size:18px}.sg small{display:block;font-size:12px;color:var(--mut);font-weight:500}
.a{background:var(--gl);border-radius:12px;padding:8px;font-size:13px;opacity:.5;filter:grayscale(1)}.a.on{opacity:1;filter:none;border:2px solid #e8a200}.a b{display:block;font-size:15px}
#md{position:fixed;inset:0;background:rgba(0,20,40,.6);display:grid;place-items:center;z-index:20;padding:20px}
#md>div{background:var(--bg2);border-radius:20px;padding:20px;text-align:center;max-width:340px;width:100%;max-height:90vh;overflow:auto}
#md button{font:inherit;font-weight:800;margin-top:8px;width:100%;padding:11px;border:0;border-radius:12px;background:var(--ac);color:#fff;cursor:pointer}
#md h2{margin:0 0 6px}.sn{width:100%;border-radius:14px}
#ts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;display:grid;justify-items:center;gap:6px;z-index:30;pointer-events:none}
.ts{background:var(--tx);color:var(--bg2);padding:8px 16px;border-radius:99px;font-weight:700;animation:tin .25s}
@keyframes tin{from{transform:translateY(-20px);opacity:0}}
@media (prefers-reduced-motion:reduce){.bb,#stage::before{animation:none}}
.pt{width:50px;height:50px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:28px;background:var(--ln);overflow:hidden;border:2px solid var(--ac2)}.pt img{width:100%;height:100%;object-fit:cover}
.fs{position:fixed;left:0;z-index:3;font-size:36px;cursor:pointer;will-change:transform}
.fs.l{animation:swl var(--t) linear forwards}.fs.r{animation:swr var(--t) linear forwards}
.fs span{display:block;animation:bob 1.1s ease-in-out infinite alternate}.fs.r span{scale:-1 1}
@keyframes swl{from{transform:translateX(105vw)}to{transform:translateX(-120px)}}
@keyframes swr{from{transform:translateX(-120px)}to{transform:translateX(105vw)}}
@keyframes bob{to{transform:translateY(14px)}}
#in{position:fixed;inset:0;z-index:40;display:grid;place-items:center;overflow:hidden;background:linear-gradient(180deg,#36b8e8,#06304f);cursor:pointer}
#in>*{grid-area:1/1}
.sb{width:var(--z);height:var(--z);border-radius:50%;border:2px solid rgba(255,255,255,.75);background:rgba(255,255,255,.2);animation:gather 1.5s cubic-bezier(.6,0,.4,1) var(--d) both}
@keyframes gather{from{transform:translate(var(--x),var(--y))}to{transform:translate(0,0) scale(.4);opacity:0}}
.ib{width:min(80vw,340px);aspect-ratio:1;border-radius:50%;border:3px solid rgba(255,255,255,.85);background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.6),rgba(255,255,255,.12) 62%);animation:grow .8s 1.35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes grow{from{transform:scale(0)}}
.tt{text-align:center;color:#fff;animation:fin .6s 1.9s both}
.tt h1{margin:0;font-size:clamp(36px,12vw,58px);line-height:1;font-weight:800;text-shadow:0 4px 0 rgba(0,40,80,.35)}
.tt p{margin:14px 0 0;font-weight:700;opacity:.9}
@keyframes fin{from{opacity:0;transform:scale(.8)}}
#in.out{animation:pop .5s forwards;pointer-events:none}
@keyframes pop{40%{transform:scale(1.06)}to{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.sb{display:none}}
#in>.rays,#in>.sea,#in>.sf{grid-area:auto;position:absolute}
.rays{inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.16) 0 30px,transparent 30px 90px);-webkit-mask-image:linear-gradient(180deg,#000,transparent 75%);mask-image:linear-gradient(180deg,#000,transparent 75%);transform-origin:50% 0;animation:sway 7s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg) scale(1.25)}to{transform:rotate(4deg) scale(1.25)}}
.sea{left:0;bottom:0;width:100%;height:30vh}
.w{transform-box:fill-box;transform-origin:50% 100%;animation:wv 2.6s ease-in-out infinite alternate}
@keyframes wv{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.sf{left:0;font-size:30px;opacity:.55;animation:swl 12s linear infinite}
.ib{position:relative;animation:grow .8s 1.35s cubic-bezier(.2,1.4,.4,1) both,wob 3s 2.2s ease-in-out infinite alternate}
.ib::after{content:"";position:absolute;left:16%;top:12%;width:22%;height:12%;border-radius:50%;background:rgba(255,255,255,.7);transform:rotate(-35deg)}
@keyframes wob{to{transform:scale(1.04,.97)}}
.sp{width:min(30vw,120px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 6px 0 rgba(0,40,80,.3);margin-bottom:10px;animation:bnc .7s 2.2s cubic-bezier(.2,1.6,.4,1) both}
@keyframes bnc{from{transform:translateY(-40px) scale(0)}}
.tt h1 span{display:inline-block;color:#ffe45c;text-shadow:0 3px 0 #c98a00,0 7px 0 rgba(0,40,80,.35);animation:lt .5s calc(2.4s + var(--i)*.06s) cubic-bezier(.2,1.6,.4,1) both}
@keyframes lt{from{transform:translateY(-30px) rotate(-12deg);opacity:0}}
.ld{width:min(60vw,220px);height:8px;border-radius:9px;background:rgba(255,255,255,.3);margin:14px auto 0;overflow:hidden}
.ld i{display:block;height:100%;background:#ffe45c;animation:fill 5.2s linear both}
@keyframes fill{from{width:0}}
.pt svg{width:100%;height:100%}
</style></head><body><main>
<div class="hd"><img id="hav" alt=""><div><b id="hnm"></b><div class="sub" id="hlv"></div></div></div>

<div class="lvl"><div><b id="ln"></b> <span class="sub" id="lm"></span></div><div class="bar"><i id="lb"></i></div></div>

<script>
const $=id=>document.getElementById(id);
const CL=[["Крепкий палец",15,1],["Большой портфель",120,6],["Золотой галстук",1100,40],["Медузья перчатка",12e3,300],["Сила Бикини-Боттома",13e4,2200],["Космический клик",14e5,16e3]];
const AU=[["Губка Боб",50,1],["Сэнди",300,6],["Сквидвард",2e3,35],["Мистер Крабс",15e3,200],["Планктон",12e4,1200],["Гэри",11e5,7500],["Русалочка и Пацан",13e6,48e3],["Летучий голландец",15e7,3e5]];
const RU=[["Сила клика","+50% к клику за уровень",5,1.8,99],["Дружная команда","+50% к доходу помощников",5,1.8,99],["Скидка Крабса","−3% к цене улучшений",8,1.9,15],["Удачный клик","+2% шанс крита ×10",10,1.7,20]];
const TT=["Новичок","Ленивый гость","Помощник повара","Жарщик котлет","Король Крабсбургера","Герой Бикини-Боттома","Морской магнат","Повелитель глубин","Звезда океана","Легенда Патрика"];
const sfx=["","K","M","B","T","Qa","Qi","Sx"];
function f(n){if(n<1e3)return n<10&&n%1?n.toFixed(1):Math.floor(n)+"";let i=Math.min(7,Math.floor(Math.log10(n)/3));return (n/1e3**i).toFixed(2)+sfx[i]}
const S0=()=>({b:0,tot:0,clicks:0,up:{},stars:0,rb:0,ru:{},all:0,name:"Патрик",av:"",img:"",gift:{d:-1,s:0},ach:{},crits:0,hp:{},t0:Date.now()});
let S=S0();
try{const j=localStorage.getItem("pat1");if(j)S=Object.assign(S0(),JSON.parse(j))}catch(e){}
const lv=()=>Math.floor(Math.pow(S.clicks/10,1/1.6))+1;
const U=(k,i)=>S[k][i]||0, R=i=>S.ru[i]||0;
const gm=()=>(1+.1*S.stars)*(1+.02*(lv()-1))*(1+.01*Object.keys(S.ach).length);
const disc=()=>1-.03*R(2);
const cost=(a,i,c)=>Math.ceil(a[i][1]*Math.pow(1.15,U("up",a===CL?i:i+10))*disc());
const key=(a,i)=>a===CL?i:i+10;
const cpc=()=>{let v=1;CL.forEach((c,i)=>v+=c[2]*U("up",i));return v*(1+.5*R(0))*gm()};
const cps=()=>{let v=0;AU.forEach((c,i)=>v+=c[2]*U("up",i+10));return v*(1+.5*R(1))*gm()};
function mk(box,arr,k){arr.forEach((c,i)=>{const e=document.createElement("button");e.className="it";e.id=k+i;e.innerHTML=`<div class="q"></div><div class="l"><div class="n">${c[0]}</div><div class="d">${k=="c"?"+"+f(c[2])+" к клику":"+"+f(c[2])+"/сек"}</div></div><div class="c"></div>`;e.onclick=()=>{const p=cost(arr,i);if(S.b>=p){S.b-=p;S.up[key(arr,i)]=U("up",key(arr,i))+1;upd()}};$(box).appendChild(e)})}
mk("t0",CL,"c");mk("t1",AU,"a");
RU.forEach((r,i)=>{const e=document.createElement("button");e.className="it";e.id="r"+i;e.innerHTML=`<div class="q"></div><div class="l"><div class="n">${r[0]}</div><div class="d">${r[1]}</div></div><div class="c"></div>`;e.onclick=()=>{const p=rc(i);if(S.stars>=p&&R(i)<r[4]){S.stars-=p;S.ru[i]=R(i)+1;upd()}};$("rl").appendChild(e)});
const rc=i=>Math.ceil(RU[i][2]*Math.pow(RU[i][3],R(i)));
const gain=()=>S.tot>=1e6?Math.floor(Math.sqrt(S.tot/1e5)):0;
function upd(){
$("b").textContent=f(S.b);
$("ps").textContent=`${f(cpc())} за клик · ${f(cps())} в секунду · ×${gm().toFixed(2)} бонус`;
const L=lv(),a=10*Math.pow(L-1,1.6),z=10*Math.pow(L,1.6);
$("ln").textContent=`Уровень ${L}: ${TT[Math.min(TT.length-1,Math.floor((L-1)/4))]}`;
$("lm").textContent=`(+${(L-1)*2}% к доходу)`;
$("lb").style.width=Math.min(100,(S.clicks-a)/(z-a)*100)+"%";
[[CL,"c"],[AU,"a"]].forEach(([arr,k])=>arr.forEach((c,i)=>{const e=$(k+i),p=cost(arr,i);e.querySelector(".q").textContent=U("up",key(arr,i));e.querySelector(".c").textContent=f(p)+" 🍔";e.disabled=S.b<p}));
RU.forEach((r,i)=>{const e=$("r"+i),p=rc(i),m=R(i)>=r[4];e.querySelector(".q").textContent=R(i);e.querySelector(".c").textContent=m?"МАКС":p+" ⭐";e.disabled=m||S.stars<p});
const g=gain();$("rbi").textContent=`У тебя ⭐ ${S.stars} (каждая даёт +10% ко всему). Перерождений: ${S.rb}. `+(g?`Сейчас получишь ⭐ ${g}.`:`Нужно заработать 1 млн 🍔 за забег (сейчас ${f(S.tot)}).`);
$("rbb").disabled=!g;$("rbb").textContent=g?`Переродиться за ⭐ ${g}`:"Пока недоступно";
